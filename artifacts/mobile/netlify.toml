[build]
  base = "."
  command = "node artifacts/mobile/scripts/export-web.js"
  publish = "artifacts/mobile/static-build"

[[redirects]]
  from = "/service-worker.js"
  to = "/retire-service-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "/sw.js"
  to = "/retire-service-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "/expo-service-worker.js"
  to = "/retire-service-worker.js"
  status = 200
  force = true

# Old account links now open the local workspace directly.
[[redirects]]
  from = "/sign-in"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/sign-up"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/login"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/signup"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/(auth)/*"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/sign-in/*"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/sign-up/*"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/login/*"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/signup/*"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/(auth)"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/sso-callback"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/forgot-password"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/reset-password"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/signin"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/signin/*"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/signout"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/signout/*"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/logout"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/logout/*"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/auth"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/auth/*"
  to = "/?workspace=account-free-v2"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Revalidate the app shell so returning visitors receive the account-free app.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    Clear-Site-Data = '"cache"'
